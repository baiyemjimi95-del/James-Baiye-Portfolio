{% extends "layouts/base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<section style="min-height: 70vh; display: flex; align-items: center; justify-content: center; padding: 60px 0;">
    <div style="text-align: center;">
        <h1 style="font-size: 6rem; font-weight: 900; background: var(--gradient-primary); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">404</h1>
        <h2 style="font-size: 2rem; margin-bottom: 16px;">Page Not Found</h2>
        <p style="color: var(--text-secondary); margin-bottom: 24px;">The page you are looking for doesn't exist or has been moved.</p>
        <a href="/" class="btn-primary"><i class="fas fa-home"></i> Go Home</a>
    </div>
</section>
{% endblock %}
