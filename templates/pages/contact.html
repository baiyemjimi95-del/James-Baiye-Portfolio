{% extends "layouts/base.html" %}

{% block title %}Contact - James Baiye{% endblock %}

{% block content %}
<section class="section">
    <div class="container">
        <h2 class="section-title text-center">Contact <span class="highlight">Me</span></h2>
        <p class="section-subtitle">Let's build something amazing together</p>
        
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 60px; max-width: 1000px; margin: 0 auto;">
            <div>
                <h3 style="font-size: 1.3rem; font-weight: 700; margin-bottom: 24px;">Get in Touch</h3>
                
                <div style="display: flex; flex-direction: column; gap: 16px;">
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div style="width: 48px; height: 48px; background: var(--glass); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent);">
                            <i class="fas fa-envelope"></i>
                        </div>
                        <div>
                            <p style="font-weight: 600;">Email</p>
                            <p style="color: var(--text-secondary);">james@example.com</p>
                        </div>
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div style="width: 48px; height: 48px; background: var(--glass); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent);">
                            <i class="fab fa-github"></i>
                        </div>
                        <div>
                            <p style="font-weight: 600;">GitHub</p>
                            <p style="color: var(--text-secondary);">github.com/baiyemjimi95-del</p>
                        </div>
                    </div>
                    
                    <div style="display: flex; align-items: center; gap: 16px;">
                        <div style="width: 48px; height: 48px; background: var(--glass); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: var(--accent);">
                            <i class="fab fa-linkedin-in"></i>
                        </div>
                        <div>
                            <p style="font-weight: 600;">LinkedIn</p>
                            <p style="color: var(--text-secondary);">linkedin.com/in/jamesbaiye</p>
                        </div>
                    </div>
                </div>
            </div>
            
            <div>
                <form method="POST" action="/contact/submit" class="contact-form">
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-weight: 500; margin-bottom: 4px;">Your Name</label>
                        <input type="text" name="name" placeholder="John Doe" required style="width: 100%; padding: 12px 16px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text); font-size: 1rem;">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-weight: 500; margin-bottom: 4px;">Email Address</label>
                        <input type="email" name="email" placeholder="john@example.com" required style="width: 100%; padding: 12px 16px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text); font-size: 1rem;">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-weight: 500; margin-bottom: 4px;">Subject</label>
                        <input type="text" name="subject" placeholder="Project Inquiry" style="width: 100%; padding: 12px 16px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text); font-size: 1rem;">
                    </div>
                    <div style="margin-bottom: 16px;">
                        <label style="display: block; font-weight: 500; margin-bottom: 4px;">Message</label>
                        <textarea name="message" rows="5" placeholder="Tell me about your project..." required style="width: 100%; padding: 12px 16px; background: var(--glass); border: 1px solid var(--glass-border); border-radius: 8px; color: var(--text); font-size: 1rem; resize: vertical;"></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width: 100%; justify-content: center;">
                        <i class="fas fa-paper-plane"></i> Send Message
                    </button>
                </form>
            </div>
        </div>
    </div>
</section>
{% endblock %}
