<header class="header">
    <div class="container">
        <a href="{{ url_for('main.index') }}" class="logo">
            James<span>Baiye</span>
        </a>
        
        <nav class="nav-links" id="nav-menu">
            <a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' }}">Home</a>
            <a href="{{ url_for('main.about') }}" class="{{ 'active' if request.endpoint == 'main.about' }}">About</a>
            <a href="{{ url_for('main.portfolio') }}" class="{{ 'active' if request.endpoint == 'main.portfolio' }}">Portfolio</a>
            <a href="{{ url_for('main.services_page') }}" class="{{ 'active' if request.endpoint == 'main.services_page' }}">Services</a>
            <a href="{{ url_for('main.blog') }}" class="{{ 'active' if request.endpoint == 'main.blog' }}">Blog</a>
            <a href="{{ url_for('main.contact') }}" class="{{ 'active' if request.endpoint == 'main.contact' }}">Contact</a>
            
            <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                <i class="fas fa-moon"></i>
            </button>
        </nav>
        
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
