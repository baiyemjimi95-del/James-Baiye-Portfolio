{% extends "admin/layout.html" %}

{% block page_title %}Dashboard{% endblock %}

{% block content %}
<p style="color:#475569; margin-bottom:24px;">Welcome to the admin panel. Here's what's happening:</p>
<div style="display:grid; grid-template-columns:repeat(4,1fr); gap:20px;">
    <div style="background:white; padding:24px; border-radius:12px; border:1px solid #e2e8f0; text-align:center;">
        <h3 style="font-size:2rem; margin:0; color:#2563eb;">{{ projects }}</h3>
        <p style="color:#475569; margin:0;">Projects</p>
    </div>
    <div style="background:white; padding:24px; border-radius:12px; border:1px solid #e2e8f0; text-align:center;">
        <h3 style="font-size:2rem; margin:0; color:#7c3aed;">{{ skills }}</h3>
        <p style="color:#475569; margin:0;">Skills</p>
    </div>
    <div style="background:white; padding:24px; border-radius:12px; border:1px solid #e2e8f0; text-align:center;">
        <h3 style="font-size:2rem; margin:0; color:#06b6d4;">{{ blogs }}</h3>
        <p style="color:#475569; margin:0;">Blog Posts</p>
    </div>
    <div style="background:white; padding:24px; border-radius:12px; border:1px solid #e2e8f0; text-align:center;">
        <h3 style="font-size:2rem; margin:0; color:#ef4444;">{{ messages }}</h3>
        <p style="color:#475569; margin:0;">New Messages</p>
    </div>
</div>
<div style="margin-top:40px; display:flex; gap:16px; flex-wrap:wrap;">
    <a href="/admin/projects/add" class="btn"><i class="fas fa-plus"></i> Add Project</a>
    <a href="/admin/blog/add" class="btn"><i class="fas fa-plus"></i> New Blog Post</a>
</div>
{% endblock %}
