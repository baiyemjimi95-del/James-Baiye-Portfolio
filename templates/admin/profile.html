{% extends "admin/layout.html" %}

{% block page_title %}Profile Settings{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin-bottom:20px;">Edit Profile</h2>
    <form method="POST">
        <div class="form-row">
            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" value="{{ profile.full_name if profile else 'James Baiye' }}" required>
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" name="email" value="{{ profile.email if profile else 'admin@example.com' }}" required>
            </div>
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>New Password (leave blank to keep current)</label>
                <input type="password" name="password">
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password">
            </div>
        </div>
        <button type="submit" class="btn">Update Profile</button>
    </form>
</div>

<div class="card">
    <h3 style="margin-bottom:16px;">Profile Photo</h3>
    <div style="display:flex; align-items:center; gap:24px;">
        <div style="width:120px; height:120px; border-radius:50%; background:#e2e8f0; display:flex; align-items:center; justify-content:center; overflow:hidden; border:3px solid #3b82f6;">
            <i class="fas fa-user" style="font-size:3rem; color:#94a3b8;"></i>
        </div>
        <div>
            <p style="color:#64748b; margin-bottom:8px;">Upload a new profile photo</p>
            <form method="POST" enctype="multipart/form-data" action="/admin/profile/photo">
                <input type="file" name="profile_image" accept="image/*" style="margin-bottom:8px;">
                <button type="submit" class="btn">Upload Photo</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
