{% extends "admin/layout.html" %}

{% block page_title %}{{ title }}{% endblock %}

{% block content %}
<div class="card">
    <h2>{{ title }}</h2>
    <form method="POST">
        <div class="form-group">
            <label>Title</label>
            <input type="text" name="title" value="{{ post.title if post else '' }}" required>
        </div>
        <div class="form-group">
            <label>Excerpt (optional)</label>
            <input type="text" name="excerpt" value="{{ post.excerpt if post else '' }}">
        </div>
        <div class="form-group">
            <label>Content (Markdown supported)</label>
            <textarea name="content" required>{{ post.content if post else '' }}</textarea>
        </div>
        <div class="form-group">
            <label>
                <input type="checkbox" name="published" {% if post and post.published %}checked{% endif %}> 
                Publish this post
            </label>
        </div>
        <button type="submit" class="btn">Save Post</button>
        <a href="/admin/blog" class="btn btn-outline">Cancel</a>
    </form>
</div>
{% endblock %}
