{% extends "admin/layout.html" %}

{% block page_title %}Settings{% endblock %}

{% block content %}
<div class="card">
    <h2 style="margin-bottom:20px;">Site Settings</h2>
    <p style="color:#64748b; margin-bottom:20px;">Configure your site settings here.</p>
    
    <form method="POST">
        <div class="form-group">
            <label>Site Name</label>
            <input type="text" name="site_name" value="James Baiye Portfolio">
        </div>
        <div class="form-group">
            <label>Site Description</label>
            <textarea name="site_description">Building software that transforms ideas into practical solutions.</textarea>
        </div>
        <button type="submit" class="btn">Save Settings</button>
    </form>
</div>
{% endblock %}
